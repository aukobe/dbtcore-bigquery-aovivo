[project]
name = "dbtcore-bigquery-aovivo"
version = "0.1.0"
description = "somente o repositório do workshop"
authors = [
    {name = "aukobe",email = "oliveiraquinze@outlook.com"}
]
readme = "README.md"
requires-python = "3.12.1"
dependencies = [
    "dbt-core (>=1.12.5,<2.0.0)",
    "dbt-bigquery (>=1.12.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "sqlfluff (>=4.4.0,<5.0.0)"
]

[tool.poetry]
package-mode = false
